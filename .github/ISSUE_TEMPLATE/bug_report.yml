name: Bug report
description: Report reproducible behavior in ZeroWire Companion
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the actual behavior and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide steps and synthetic data; do not include credentials or private information.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Version and environment

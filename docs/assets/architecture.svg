<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000" role="img"><title>Security intelligence architecture</title><desc>One Cloudflare Worker · Scheduled ingestion and public reads are separate</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#8498b2"/></marker></defs><rect width="1500" height="1000" rx="22" fill="#0b1422"/><g font-family="Arial, Helvetica, sans-serif"><text x="55" y="65" font-size="18" fill="#5cddc3" font-weight="700">ZEROWIRE COMPANION  /  IYELABS</text><text x="55" y="120" font-size="43" fill="#f3f7fc" font-weight="700">Security intelligence architecture</text><text x="55" y="155" font-size="21" fill="#a6b7cb" font-weight="400">One Cloudflare Worker · Scheduled ingestion and public reads are separate</text></g><g font-family="Arial, Helvetica, sans-serif"><text x="55" y="207" font-size="17" fill="#93a9c3" font-weight="700">OFFICIAL AND PUBLIC SOURCES</text><rect x="55" y="225" width="260" height="88" rx="12" fill="#172438" stroke="#33445b" stroke-width="2"/><text x="75" y="259" font-size="20" fill="#ffffff" font-weight="700">Cloudflare</text><text x="75" y="290" font-size="19" fill="#b6c8db" font-weight="400">Zero Wire RSS</text><rect x="337" y="225" width="260" height="88" rx="12" fill="#172438" stroke="#33445b" stroke-width="2"/><text x="357" y="259" font-size="20" fill="#ffffff" font-weight="700">CISA</text><text x="357" y="290" font-size="19" fill="#b6c8db" font-weight="400">KEV catalog</text><rect x="619" y="225" width="260" height="88" rx="12" fill="#172438" stroke="#33445b" stroke-width="2"/><text x="639" y="259" font-size="20" fill="#ffffff" font-weight="700">FIRST</text><text x="639" y="290" font-size="19" fill="#b6c8db" font-weight="400">EPSS</text><rect x="901" y="225" width="260" height="88" rx="12" fill="#172438" stroke="#33445b" stroke-width="2"/><text x="921" y="259" font-size="20" fill="#ffffff" font-weight="700">GitHub</text><text x="921" y="290" font-size="19" fill="#b6c8db" font-weight="400">Security Advisories</text><rect x="1183" y="225" width="260" height="88" rx="12" fill="#172438" stroke="#33445b" stroke-width="2"/><text x="1203" y="259" font-size="20" fill="#ffffff" font-weight="700">OSV.dev</text><text x="1203" y="290" font-size="19" fill="#b6c8db" font-weight="400">Selected records</text><path d="M185 313 V338 M467 313 V338 M749 313 V338 M1031 313 V338 M1313 313 V338 M185 338 H1313" stroke="#8498b2" stroke-width="2" fill="none"/><path d="M750 339 L750 352" stroke="#8498b2" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="55" y="365" width="1390" height="190" rx="16" fill="#102b2e" stroke="#248b7e" stroke-width="2"/><text x="80" y="404" font-size="20" fill="#70e1cb" font-weight="700">SCHEDULED INGESTION  ·  CRON TRIGGER</text><text x="80" y="438" font-size="23" fill="#ffffff" font-weight="700">Fetch &amp; validate</text><text x="80" y="470" font-size="18" fill="#afc9cc" font-weight="400">Fixed source adapters</text><text x="80" y="498" font-size="18" fill="#afc9cc" font-weight="400">Bounded refresh &amp; retries</text><text x="505" y="438" font-size="23" fill="#ffffff" font-weight="700">Normalize &amp; connect</text><text x="505" y="470" font-size="18" fill="#afc9cc" font-weight="400">Canonical IDs and aliases</text><text x="505" y="498" font-size="18" fill="#afc9cc" font-weight="400">Observed semantic changes</text><text x="930" y="438" font-size="23" fill="#ffffff" font-weight="700">Enrich &amp; persist</text><text x="930" y="470" font-size="18" fill="#afc9cc" font-weight="400">KEV, EPSS &amp; package evidence</text><text x="930" y="498" font-size="18" fill="#afc9cc" font-weight="400">Source dates and freshness</text><path d="M386 463 L466 463" stroke="#8498b2" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M816 463 L896 463" stroke="#8498b2" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M750 563 L750 591" stroke="#8498b2" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="320" y="604" width="860" height="96" rx="16" fill="#14273d" stroke="#4d7ba6" stroke-width="2"/><text x="355" y="646" font-size="22" fill="#ffffff" font-weight="700">CLOUDFLARE D1  ·  PERSISTENT INTELLIGENCE</text><text x="355" y="678" font-size="19" fill="#c4d4e4" font-weight="400">Briefings  /  history  /  KEV  /  EPSS  /  package context  /  provenance</text><path d="M750 706 L750 730" stroke="#8498b2" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="55" y="742" width="1390" height="132" rx="16" fill="#172340" stroke="#456fd3" stroke-width="2"/><text x="80" y="780" font-size="20" fill="#9db8ff" font-weight="700">PUBLIC READ PATH  ·  SAME WORKER</text><text x="80" y="815" font-size="25" fill="#ffffff" font-weight="700">Read-only MCP  /  JSON &amp; RSS feeds</text><text x="80" y="846" font-size="19" fill="#c6d3ed" font-weight="400">Bounded queries · rate limits · no upstream requests or intelligence writes</text><path d="M400 881 L400 905" stroke="#8498b2" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1100 881 L1100 905" stroke="#8498b2" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="225" y="943" font-size="20" fill="#eaf1fa" font-weight="700">MCP CLIENTS  ·  STREAMABLE HTTP</text><text x="952" y="943" font-size="20" fill="#eaf1fa" font-weight="700">FEED READERS  ·  AUTOMATIONS</text></g></svg>